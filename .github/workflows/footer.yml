name: Update contribution footer

on:
  schedule:
    - cron: "17 16 * * *"   # once a day, 16:17 UTC (00:17 in UTC+8)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["tools/build_footer.py", ".github/workflows/footer.yml"]

permissions:
  contents: write

jobs:
  footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build footer from the contribution graph
        run: python tools/build_footer.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the new footer if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/footer.svg
          git diff --cached --quiet || (git commit -m "Update contribution footer" && git push)
