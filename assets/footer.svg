<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-label="Thanks for stopping by. A cat is asleep on a laptop.">
  <title>Thanks for stopping by</title>
  <style>
    .h { font: 800 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: -.3px }
    .s { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e }
    .code { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace }
    .breath { transform-box: fill-box; transform-origin: 50% 100%; animation: breath 3.2s ease-in-out infinite }
    @keyframes breath { 0%,100% { transform: scale(1,1) } 50% { transform: scale(1.02,1.06) } }
    .z { font: 800 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #fb923c; opacity: 0; animation: z 3.6s ease-out infinite }
    .z2 { animation-delay: 1.2s; font-size: 13px } .z3 { animation-delay: 2.4s; font-size: 11px }
    @keyframes z { 0% { opacity: 0; transform: translate(0,0) } 20% { opacity: 1 } 100% { opacity: 0; transform: translate(14px,-34px) } }
    .tail { transform-box: fill-box; transform-origin: 0% 50%; animation: flick 5s ease-in-out infinite }
    @keyframes flick { 0%,80%,100% { transform: rotate(0) } 86% { transform: rotate(-8deg) } 92% { transform: rotate(4deg) } }
    .ln { animation: ln 2.8s ease-in-out infinite }
    @keyframes ln { 0%,100% { opacity: .9 } 50% { opacity: .45 } }
    </style>
  <defs><clipPath id="ff"><rect width="900" height="170" rx="18"/></clipPath>
  <radialGradient id="fg" cx="80%" cy="100%" r="60%"><stop offset="0" stop-color="#fb923c" stop-opacity=".14"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient></defs>
  <g clip-path="url(#ff)">
    <rect width="900" height="170" fill="#0d1117"/>
    <rect width="900" height="170" fill="url(#fg)"/>
    <text class="h" x="48" y="94">Thanks for stopping by.</text>

    <!-- laptop -->
    <rect x="600" y="44" width="190" height="86" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect class="ln" style="animation-delay:0.0s" x="618" y="62" width="70" height="5" rx="2.5" fill="#ff7b72" fill-opacity=".8"/><rect class="ln" style="animation-delay:0.4s" x="630" y="73" width="110" height="5" rx="2.5" fill="#79c0ff" fill-opacity=".8"/><rect class="ln" style="animation-delay:0.8s" x="618" y="84" width="54" height="5" rx="2.5" fill="#d2a8ff" fill-opacity=".8"/><rect class="ln" style="animation-delay:1.2s" x="630" y="95" width="90" height="5" rx="2.5" fill="#7ee787" fill-opacity=".8"/><rect class="ln" style="animation-delay:1.6s" x="618" y="106" width="64" height="5" rx="2.5" fill="#79c0ff" fill-opacity=".8"/>
    <path d="M580 130 h230 l-10 12 h-210 z" fill="#21262d" stroke="#30363d"/>

    <!-- sleeping cat curled on the keyboard deck -->
    <g transform="translate(700 131)">
      <g class="tail"><path d="M30 -4 C 52 -2, 58 -18, 44 -24" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/></g>
      <g class="breath">
        <ellipse cx="0" cy="-17" rx="38" ry="19" fill="#fb923c"/>
        <path d="M-14 -33 q4 10 0 22 M-2 -36 q4 12 0 26 M10 -35 q4 11 0 24" stroke="#c2410c" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".5"/>
      </g>
      <circle cx="-30" cy="-16" r="14" fill="#fb923c"/>
      <path d="M-42 -24 L-44 -40 L-32 -29 Z" fill="#fb923c"/><path d="M-41 -28 L-42 -35 L-36 -30 Z" fill="#fda4af"/>
      <path d="M-27 -29 L-19 -40 L-17 -24 Z" fill="#fb923c"/>
      <path d="M-38 -15 q3 3 6 0 M-28 -15 q3 3 6 0" stroke="#7c2d12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle cx="-30" cy="-10" r="1.6" fill="#fda4af"/>
      <ellipse cx="-14" cy="-3" rx="9" ry="4" fill="#fdba74"/>
      <text class="z" x="-50" y="-44">z</text><text class="z z2" x="-50" y="-44">z</text><text class="z z3" x="-50" y="-44">z</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="899" height="169" rx="18" fill="none" stroke="#30363d"/>
</svg>
